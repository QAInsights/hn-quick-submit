<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <script src="/theme-boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit to Hacker News</title>
  </head>
  <body>
    <main class="popup">
      <header class="popup-head">
        <span class="mark" aria-hidden="true">Y</span>
        <h1>Post to Hacker News</h1>
        <a
          class="icon-link"
          href="../settings/index.html"
          target="_blank"
          title="Settings"
          aria-label="Open settings"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm9.4 3.5c0-.5-.04-1-.13-1.47l2.07-1.62-2-3.46-2.45.98a8.6 8.6 0 0 0-2.54-1.47L15.97 2h-4l-.38 2.46a8.6 8.6 0 0 0-2.54 1.47l-2.45-.98-2 3.46 2.07 1.62a8.7 8.7 0 0 0 0 2.94l-2.07 1.62 2 3.46 2.45-.98c.77.63 1.63 1.13 2.54 1.47l.38 2.46h4l.38-2.46a8.6 8.6 0 0 0 2.54-1.47l2.45.98 2-3.46-2.07-1.62c.09-.47.13-.97.13-1.47Z"
            />
          </svg>
        </a>
      </header>

      <section id="form-view" aria-labelledby="form-heading">
        <h2 id="form-heading" class="visually-hidden">Submission details</h2>
        <form id="submit-form" novalidate>
          <div class="field">
            <label for="f-title">Title</label>
            <input
              type="text"
              id="f-title"
              name="title"
              required
              maxlength="200"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
              aria-describedby="title-hint"
            >
            <span class="hint" id="title-hint">HN's limit is 80 characters.</span>
          </div>
          <div class="field">
            <label for="f-url">URL</label>
            <input
              type="url"
              id="f-url"
              name="url"
              class="mono"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="none"
              placeholder="https://"
            >
          </div>
          <div class="field">
            <label for="f-text">Comment <span class="optional">(optional)</span></label>
            <textarea
              id="f-text"
              name="text"
              rows="4"
              placeholder="Posted as the first comment"
            ></textarea>
          </div>
          <p class="hint clean-note" id="clean-note" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="post-btn">
            Submit to Hacker News
          </button>
        </form>
      </section>

      <section id="busy-view" class="state-view" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>Posting to Hacker News…</p>
      </section>

      <section id="result-view" class="state-view" hidden>
        <div id="result-icon" class="result-icon" aria-hidden="true"></div>
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <a id="result-link" class="btn btn-primary btn-block" href="#" target="_blank" rel="noopener">
          View on Hacker News
        </a>
        <button type="button" class="btn btn-ghost btn-block" id="result-back">
          Back
        </button>
      </section>

      <div role="status" aria-live="polite" id="live-region" class="visually-hidden"></div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
